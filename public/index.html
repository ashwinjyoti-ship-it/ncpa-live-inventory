<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#141210" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>NCPA Crew Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="brand-mark">NCPA</div>
      <div class="brand-sub">SOUND · CREW STOCKTAKE</div>
    </div>
  </header>

  <main id="app"></main>

  <nav class="bottom-nav" id="nav-tabs">
    <button data-view="home" class="active" type="button">
      <span class="nav-icon">▣</span>
      <span>Venues</span>
    </button>
    <button data-view="history" type="button">
      <span class="nav-icon">☰</span>
      <span>Reports</span>
    </button>
    <button data-view="import" type="button">
      <span class="nav-icon">↑</span>
      <span>Import</span>
    </button>
  </nav>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
